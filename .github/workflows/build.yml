name: Mktime UTC diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  utc:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set disposable runner to UTC
        shell: pwsh
        run: |
          tzutil /s UTC
          if ((tzutil /g) -ne 'UTC') { throw 'UTC host required' }
          tzutil /g
      - name: Install repository-standard WinLibs
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
          echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
          for prefix in ucrt64 mingw64; do
            bundle="C:/Program Files/Git/$prefix/etc/ssl/certs/ca-bundle.crt"
            if [ -f "$bundle" ]; then echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"; break; fi
          done
      - name: Configure focused native tests
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DANYPS5_BUILD_WASM=OFF
      - name: Build actual mktime fixture and dependencies
        shell: cmd
        run: cmake --build build --parallel 2 --target guest_mktime_tests
      - name: Run named UTC-host cases
        continue-on-error: true
        shell: cmd
        run: ctest --test-dir build -R "^guest_mktime$" --parallel 1 --timeout 60 -V --output-log mktime-utc.log --output-junit mktime-utc.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mktime-utc-diagnostic
          path: |
            mktime-utc.log
            mktime-utc.xml
            build/CMakeCache.txt
          if-no-files-found: ignore

name: Mktime UTC qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  utc:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 59d2b51c999b8e228bd51eefeffbfb55c4b3093c
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Set and record disposable runner UTC zone
        shell: pwsh
        run: |
          tzutil /s UTC
          if ((tzutil /g) -ne 'UTC') { throw 'UTC host required' }
          Get-TimeZone | Select-Object Id,BaseUtcOffset | ConvertTo-Json
      - name: Install repository-standard WinLibs
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
          echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
          for prefix in ucrt64 mingw64; do
            bundle="C:/Program Files/Git/$prefix/etc/ssl/certs/ca-bundle.crt"
            if [ -f "$bundle" ]; then echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"; break; fi
          done
      - name: Qualify exact candidate and prior production on UTC host
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys,os,json,hashlib,time,traceback,re,xml.etree.ElementTree as ET
          candidate='59d2b51c999b8e228bd51eefeffbfb55c4b3093c'
          prior='7e8465539372e0c6615956deac04adfe5886b30e'
          source=Path.cwd();evidence=Path(os.environ['RUNNER_TEMP'])/'mktime-utc-evidence';evidence.mkdir(exist_ok=True)
          build=Path(os.environ['RUNNER_TEMP'])/'mktime-utc-build';hooks=evidence/'empty-hooks';hooks.mkdir(exist_ok=True)
          git=['git','-c','core.hooksPath='+str(hooks),'-c','gc.auto=0','-c','core.commitGraph=false']
          state={'started':time.time(),'terminal':False,'prior_production':prior,'candidate':candidate,'scope':'Actual disposable Windows UTC host; old production plus identical named fixture, then exact candidate production and four guest time suites. No game assets/GPU/desktop changes.'}
          def save(): (evidence/'result.json').write_text(json.dumps(state,indent=2))
          def read(*args):return subprocess.check_output(git+list(args),text=True).strip()
          def run(label,args,check=True,timeout=1200):
           state['stage']=label;save();print(label,flush=True)
           with (evidence/(label+'.log')).open('w',encoding='utf-8') as out:p=subprocess.run(list(map(str,args)),stdout=out,stderr=subprocess.STDOUT,timeout=timeout)
           if check and p.returncode:raise RuntimeError(label+' exit '+str(p.returncode))
           return p.returncode
          pattern=re.compile(r'available-hint context=(\S+) converter=(\S+) month=(-?\d+) hint=(-?\d+) actual=(-?\d+) expected=(-?\d+) hour=(-?\d+) expectedHour=(-?\d+) isdst=(-?\d+) expectedIsdst=(-?\d+) standardBias=(-?\d+) daylightBias=(-?\d+)')
          def named_rows(text):
           fields=['context','converter','month','hint','actual','expected','hour','expectedHour','isdst','expectedIsdst','standardBias','daylightBias'];out=[]
           for match in pattern.finditer(text):
            row=dict(zip(fields,match.groups()))
            for field in fields[2:]:row[field]=int(row[field])
            row['mismatch']=any(row[a]!=row[b] for a,b in [('actual','expected'),('hour','expectedHour'),('isdst','expectedIsdst')]);out.append(row)
           return out
          try:
           assert sys.platform=='win32'
           state['host_zone']=subprocess.check_output(['tzutil','/g'],text=True).strip();assert state['host_zone']=='UTC'
           os.environ.pop('TZ',None)
           assert read('rev-parse','HEAD')==candidate
           fixture_bytes=subprocess.check_output(git+['show',candidate+':core/libs/tests/GuestMktime.cpp']);fixture=fixture_bytes.decode('utf-8');fixture_path=source/'core/libs/tests/GuestMktime.cpp'
           state['fixture_sha256']=hashlib.sha256(fixture.encode()).hexdigest()
           assert not read('diff',prior,candidate,'--','3rdparty','.gitmodules')
           run('checkout-prior',git+['checkout','--detach',prior]);fixture_path.write_text(fixture,encoding='utf-8',newline='\n')
           configure=['cmake','-S',str(source),'-B',str(build),'-G','Ninja','-DCMAKE_BUILD_TYPE=Release','-DBUILD_TESTING=ON','-DCMAKE_C_COMPILER=gcc','-DCMAKE_CXX_COMPILER=g++','-DANYPS5_BUILD_WASM=OFF','-DANYPS5_ENABLE_SPIRV_TOOLS=ON']
           run('prior-configure',configure);run('prior-build',['cmake','--build',build,'--parallel','2','--target','guest_mktime_tests'],timeout=1800)
           prior_xml=evidence/'prior.xml';prior_code=run('prior-ctest',['ctest','--test-dir',build,'-R','^guest_mktime$','--parallel','1','--timeout','60','-V','--no-tests=error','--output-junit',prior_xml],check=False,timeout=180)
           prior_text=(evidence/'prior-ctest.log').read_text(errors='replace');prior_rows=named_rows(prior_text);host_rows=[r for r in prior_rows if r['context']=='host-state'];state['prior']={'ctest_exit':prior_code,'rows':prior_rows};save()
           assert prior_code!=0 and 'available daylight hint cases differ' in prior_text and len(host_rows)==6 and any(r['mismatch'] for r in host_rows),'Actual UTC prior-production failure not reproduced by the six named host-state conversions'
           run('restore-prior-fixture',git+['restore','--source=HEAD','--','core/libs/tests/GuestMktime.cpp']);run('checkout-candidate',git+['checkout','--detach',candidate]);assert read('rev-parse','HEAD')==candidate and not read('status','--porcelain','--untracked-files=no')
           assert hashlib.sha256(fixture_path.read_text(encoding='utf-8').encode()).hexdigest()==state['fixture_sha256']
           run('candidate-configure',configure);targets=['guest_mktime_tests','guest_time_conversion_tests','guest_time_extras_tests','guest_strftime_tests'];run('candidate-build',['cmake','--build',build,'--parallel','2','--target',*targets],timeout=1800)
           candidate_xml=evidence/'candidate.xml';candidate_code=run('candidate-ctest',['ctest','--test-dir',build,'-R','^guest_(mktime|time_conversion|time_extras|strftime)$','--parallel','1','--timeout','60','-V','--no-tests=error','--output-junit',candidate_xml],check=False,timeout=360)
           nodes=ET.parse(candidate_xml).getroot().findall('.//testcase');rows=named_rows((evidence/'candidate-ctest.log').read_text(errors='replace'));state['candidate_result']={'ctest_exit':candidate_code,'cases':[{'name':n.get('name'),'failed':bool(n.findall('failure') or n.findall('error')),'skipped':bool(n.findall('skipped'))} for n in nodes],'rows':rows};save()
           assert candidate_code==0 and len(nodes)==4 and not any(n.findall('failure') or n.findall('error') or n.findall('skipped') for n in nodes)
           assert len([r for r in rows if r['context']=='host-state'])==6 and not any(r['mismatch'] for r in rows)
           state['host_zone_after']=subprocess.check_output(['tzutil','/g'],text=True).strip();assert state['host_zone_after']=='UTC'
           assert read('rev-parse','HEAD')==candidate and not read('status','--porcelain','--untracked-files=no')
           state['passed']=True
          except BaseException as error:state.update(passed=False,error=repr(error),traceback=traceback.format_exc())
          finally:state.update(terminal=True,finished=time.time());save()
          print(json.dumps({k:state.get(k) for k in ['terminal','passed','stage','host_zone','error']}))
          raise SystemExit(0 if state.get('passed') else 1)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mktime-utc-qualification
          path: ${{ runner.temp }}/mktime-utc-evidence/
          if-no-files-found: error

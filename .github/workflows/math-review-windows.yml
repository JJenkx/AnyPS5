name: Exact-head Windows math review
on:
  push:
    branches: [validation/math-windows-20261024]
    paths: [.github/workflows/math-review-windows.yml, .github/validation/windows_math.py]
permissions:
  contents: read
jobs:
  math:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 1673ec6b712c70e1973fad68b614f457ebba16b2
          path: source
          persist-credentials: false
      - name: Trust Git for Windows CA bundle
        run: |
          for prefix in ucrt64 mingw64; do
            bundle="C:/Program Files/Git/$prefix/etc/ssl/certs/ca-bundle.crt"
            if [ -f "$bundle" ]; then echo "SSL_CERT_FILE=$bundle" >> "$GITHUB_ENV"; exit 0; fi
          done
          exit 1
      - id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - name: Validate the three exact heads and production-only controls
        shell: cmd
        run: python harness\.github\validation\windows_math.py source evidence
      - name: Upload logs and exact-head receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-math-review
          path: |
            evidence/
            harness/.github/validation/windows_math.py
            harness/.github/workflows/math-review-windows.yml
          if-no-files-found: error
          retention-days: 30
